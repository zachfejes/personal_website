<div class="header">
  <a class="wordmark" routerLink="/" (click)="closeMenu()">Zach Fejes</a>
  <button
    class="menu-toggle"
    type="button"
    aria-controls="site-nav"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
    <span class="menu-icon" [class.is-open]="menuOpen()" aria-hidden="true"></span>
  </button>
  <nav id="site-nav" class="nav" [class.is-open]="menuOpen()" aria-label="Main">
    <ul>
      @for (link of links; track link.fragment) {
        <li>
          <a routerLink="/" [fragment]="link.fragment" (click)="closeMenu()">{{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>
</div>
