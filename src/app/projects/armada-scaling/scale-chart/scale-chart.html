<figure class="chart">
  <div class="chart__controls">
    @if (fits().length) {
      <div class="chart__toggles" role="group" aria-label="Fits to show">
        @for (fit of curves(); track fit.id) {
          <button
            type="button"
            class="chart__toggle"
            [attr.aria-pressed]="fit.on"
            (click)="toggle(fit.id)"
          >
            <span class="chart__swatch chart__swatch--line" [style.background]="fit.color"></span>
            {{ fit.label }}
          </button>
        }
      </div>
    }
    @if (optional(); as optional) {
      <div class="chart__toggles chart__optional" role="group" aria-label="Ships to show">
        <button
          type="button"
          class="chart__toggle"
          [attr.aria-pressed]="showOptional()"
          (click)="toggleOptional()"
        >
          {{ optional.label }}
        </button>
      </div>
    }
    <div class="chart__toggles chart__scale" role="group" aria-label="Axis scale">
      <span class="chart__group-label" aria-hidden="true">Axes</span>
      @for (kind of scaleKinds; track kind) {
        <button
          type="button"
          class="chart__toggle"
          [attr.aria-pressed]="scale() === kind"
          (click)="scale.set(kind)"
        >
          {{ kind === 'log' ? 'Log' : 'Linear' }}
        </button>
      }
    </div>
  </div>

  <svg
    #svg
    class="chart__plot"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    role="img"
    tabindex="0"
    [attr.aria-label]="caption() + '. Use the arrow keys to read each point.'"
    (pointermove)="pick($event)"
    (pointerdown)="pick($event)"
    (pointerleave)="$event.pointerType === 'mouse' && active.set(null)"
    (keydown)="step($event)"
    (blur)="active.set(null)"
  >
    <defs>
      <clipPath [attr.id]="clipId">
        <rect
          [attr.x]="view.margin.left"
          [attr.y]="view.margin.top"
          [attr.width]="width() - view.margin.left - view.margin.right"
          [attr.height]="height() - view.margin.top - view.margin.bottom"
        />
      </clipPath>
    </defs>

    <!-- Grid and axes -->
    <g class="chart__axis" [style.font-size.px]="design().labelSizePx">
      @for (t of yTicks(); track t) {
        @if (design().showGrid) {
          <line
            class="chart__grid"
            [attr.x1]="view.margin.left"
            [attr.x2]="width() - view.margin.right"
            [attr.y1]="y()(t)"
            [attr.y2]="y()(t)"
          />
        }
        <text
          [attr.x]="view.margin.left - view.tickGap"
          [attr.y]="y()(t)"
          text-anchor="end"
          dominant-baseline="middle"
        >
          {{ format(t, axes().y.decimals) }}
        </text>
      }
      @for (t of xTicks(); track t) {
        @if (design().showGrid) {
          <line
            class="chart__grid"
            [attr.x1]="x()(t)"
            [attr.x2]="x()(t)"
            [attr.y1]="view.margin.top"
            [attr.y2]="height() - view.margin.bottom"
          />
        }
        <text
          [attr.x]="x()(t)"
          [attr.y]="height() - view.margin.bottom + view.tickGap"
          text-anchor="middle"
          dominant-baseline="hanging"
        >
          {{ format(t, axes().x.decimals) }}
        </text>
      }
      <line
        class="chart__baseline"
        [attr.x1]="view.margin.left"
        [attr.x2]="width() - view.margin.right"
        [attr.y1]="height() - view.margin.bottom"
        [attr.y2]="height() - view.margin.bottom"
      />
      <text
        class="chart__title"
        [attr.x]="(view.margin.left + width() - view.margin.right) / 2"
        [attr.y]="height() - view.margin.bottom + view.axisTitleGap.x"
        text-anchor="middle"
      >
        {{ titles().x }}
      </text>
      <text
        class="chart__title"
        [attr.transform]="
          'translate(' +
          (view.margin.left - view.axisTitleGap.y) +
          ' ' +
          (height() - view.margin.bottom + view.margin.top) / 2 +
          ') rotate(-90)'
        "
        text-anchor="middle"
      >
        {{ titles().y }}
      </text>
    </g>

    <!-- Band, reference line and fits -->
    <g [attr.clip-path]="'url(#' + clipId + ')'">
      @if (bandPath(); as d) {
        <path class="chart__band" [attr.d]="d" />
      }
      @let ref = reference();
      @if (ref !== null) {
        <line
          class="chart__reference"
          [attr.x1]="view.margin.left"
          [attr.x2]="width() - view.margin.right"
          [attr.y1]="y()(ref)"
          [attr.y2]="y()(ref)"
        />
      }
      @for (fit of curves(); track fit.id) {
        @if (fit.on) {
          <path
            class="chart__fit"
            [attr.d]="fit.d"
            [style.stroke]="fit.color"
            [attr.stroke-width]="design().fitWidth"
          />
        }
      }
    </g>

    <!-- Points -->
    @for (p of points(); track p.series + p.name) {
      @if (p.spread !== undefined) {
        <g class="chart__error-bar">
          <line
            [attr.x1]="p.cx"
            [attr.x2]="p.cx"
            [attr.y1]="y()(p.y - p.spread)"
            [attr.y2]="y()(p.y + p.spread)"
          />
          <line
            [attr.x1]="p.cx - view.capHalfWidth"
            [attr.x2]="p.cx + view.capHalfWidth"
            [attr.y1]="y()(p.y - p.spread)"
            [attr.y2]="y()(p.y - p.spread)"
          />
          <line
            [attr.x1]="p.cx - view.capHalfWidth"
            [attr.x2]="p.cx + view.capHalfWidth"
            [attr.y1]="y()(p.y + p.spread)"
            [attr.y2]="y()(p.y + p.spread)"
          />
        </g>
      }
      <circle
        class="chart__point"
        [class.chart__point--planned]="p.series === 'planned'"
        [class.chart__point--highlight]="p.series === 'highlight'"
        [class.is-active]="active() === p"
        [attr.cx]="p.cx"
        [attr.cy]="p.cy"
        [attr.r]="radius(p)"
      />
      @if (p.series === 'highlight') {
        <text
          class="chart__callout"
          [attr.x]="p.cx"
          [attr.y]="p.cy - radius(p) - view.tickGap"
          text-anchor="middle"
          [style.font-size.px]="design().labelSizePx"
        >
          {{ p.name }}
        </text>
      }
    }

    <!-- Named ships, on leader lines -->
    @for (a of annotations(); track a.text) {
      <g class="chart__annotation" [style.font-size.px]="design().labelSizePx">
        <circle [attr.cx]="a.cx" [attr.cy]="a.cy" r="8" />
        <line [attr.x1]="a.cx" [attr.y1]="a.cy" [attr.x2]="a.x" [attr.y2]="a.y" />
        <text
          [attr.x]="a.x + (a.anchor === 'start' ? view.tickGap : -view.tickGap)"
          [attr.y]="a.y"
          [attr.text-anchor]="a.anchor"
          dominant-baseline="middle"
        >
          {{ a.text }}
        </text>
      </g>
    }

    <!-- Read-out: crosshairs to both axes, and the values -->
    @if (tooltip(); as tip) {
      <g class="chart__crosshair">
        <line [attr.x1]="tip.cx" [attr.x2]="tip.cx" [attr.y1]="tip.cy" [attr.y2]="tip.axisBottom" />
        <line [attr.x1]="tip.axisLeft" [attr.x2]="tip.cx" [attr.y1]="tip.cy" [attr.y2]="tip.cy" />
        <circle [attr.cx]="tip.cx" [attr.cy]="tip.cy" r="10" />
      </g>
      <g class="chart__tooltip" [attr.transform]="'translate(' + tip.x + ' ' + tip.y + ')'">
        <rect [attr.width]="tip.width" [attr.height]="tip.height" />
        <text
          class="chart__tooltip-name"
          [attr.x]="view.tooltip.padX"
          [attr.y]="view.tooltip.padY"
          dominant-baseline="hanging"
          [style.font-size.px]="tip.size"
        >
          {{ tip.name }}
        </text>
        <text
          [attr.x]="view.tooltip.padX"
          [attr.y]="view.tooltip.padY + tip.size + view.tooltip.lineGap"
          dominant-baseline="hanging"
          [style.font-size.px]="tip.size"
        >
          {{ tip.from }}
          <tspan class="chart__tooltip-value">{{ tip.to }}</tspan>
        </text>
      </g>
    }
  </svg>

  <figcaption class="chart__caption">
    <span>{{ caption() }}</span>
    <span class="chart__legend">
      <span><span class="chart__swatch"></span>Armada ships</span>
      @if (band(); as band) {
        <span><span class="chart__swatch chart__swatch--band"></span>{{ band.label }}</span>
      }
      @if (planned().length) {
        <span><span class="chart__swatch chart__swatch--planned"></span>Planned ships</span>
      }
    </span>
  </figcaption>

  <details class="chart__data">
    <summary>Show the data</summary>
    <table>
      <caption class="sr-only">
        {{
          caption()
        }}
      </caption>
      <thead>
        <tr>
          <th scope="col">Ship</th>
          <th scope="col">{{ headers().x }}</th>
          <th scope="col">{{ headers().y }}</th>
        </tr>
      </thead>
      <tbody>
        @for (p of rows(); track p.series + p.name) {
          <tr>
            <th scope="row">{{ p.name }}{{ p.series === 'ship' ? '' : ' (predicted)' }}</th>
            <td>{{ format(p.x, axes().x.decimals) }}</td>
            <td>{{ format(p.y, axes().y.decimals) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </details>
</figure>
